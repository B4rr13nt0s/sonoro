name: CI

# `push` solo en main y `pull_request` para el resto: con los dos sin filtro,
# cada commit de una rama con PR corría todo dos veces (build, e2e y Lighthouse).
on:
  push:
    branches: [main]
  pull_request:

# El CI solo lee el repositorio; sin esto el GITHUB_TOKEN toma los permisos por
# defecto del repo, que pueden incluir escritura.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lighthouse:
    name: Lighthouse CI (Performance ≥ 90, Accessibility ≥ 95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx lhci autorun
